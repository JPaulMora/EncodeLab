# EncodeLab reverse proxy
#
# Uploads are 16 MiB FormData chunks to /api/library/chunk and
# /api/comparisons/external/chunk. Nginx defaults to client_max_body_size 1m,
# which returns 413 Request Entity Too Large.
#
# Install:
#   sudo cp config/nginx/encodelab.conf /etc/nginx/sites-available/encodelab
#   # edit server_name and upstream ports if needed
#   sudo ln -s /etc/nginx/sites-available/encodelab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is a complete `http { }` snippet for testing. On a real host, put
# the `map` in http {} (e.g. nginx.conf) and the `server` in sites-available.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream encodelab_ui {
    server 127.0.0.1:5173;
}

upstream encodelab_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name encodelab.example.com;  # change me

    # 16 MiB chunks + multipart overhead. 64m is plenty; 0 disables the limit.
    client_max_body_size 64m;
    client_body_timeout 300s;

    # Stream the body to FastAPI instead of spooling the whole chunk to disk.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/ {
        proxy_pass http://encodelab_api;
    }

    location /media/ {
        proxy_pass http://encodelab_api;
    }

    location /ws {
        proxy_pass http://encodelab_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://encodelab_ui;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
